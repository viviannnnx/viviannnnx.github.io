<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: #222;
        }

        .page {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            border-right: 1px solid #ddd;
            padding: 40px 30px;
            position: sticky;
            left: 0;
            top: 0;
            flex-shrink: 0;
        }

        .sidebar a {
            text-decoration: none;
            color: #333;
            font-size: 18px;
        }

        .content {
            flex: 1;
            min-width: 0;
            max-width: 900px;
            padding: 50px 70px;
        }

        .project-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 26px;
            margin-top: 45px;
            margin-bottom: 20px;
        }

        h3 {
            font-size: 22px;
            margin-top: 35px;
            margin-bottom: 15px;
        }

        p {
            line-height: 1.6;
            font-size: 16px;
        }

        /* Figures replace the old .image divs so each picture
           carries its own caption and has no extra background/whitespace */
        figure {
            margin: 0;
        }

        figure img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #ccc;
        }

        figcaption {
            margin-top: 8px;
            font-size: 14px;
            color: #444;
            text-align: center;
        }

        .image-row {
            display: flex;
            flex-wrap: nowrap;
            gap: 16px;
            margin: 20px 0 40px;
        }

        .image-row figure {
            flex: 1 1 0;
            min-width: 0;
        }

        .gif {
            width: 100%;
            max-width: 600px;
            margin: 20px 0 0;
        }

        .gif img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #ccc;
        }

        @media (max-width: 700px) {
            .page {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
                position: static;
                padding: 20px;
            }

            .content {
                max-width: 100%;
                padding: 30px 20px;
            }

            .image-row {
                flex-direction: column;
                flex-wrap: nowrap;
            }

            .image-row figure {
                flex: 1 1 auto;
                min-width: 0;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <aside class="sidebar">
        <a href="../index.html">Back to Portfolio</a>
    </aside>

    <main class="content">

        <div class="project-title">
            Project 0: Becoming Friends with Your Camera
        </div>

        <section>

            <h2>Part 1: Selfie: The Wrong Way vs. The Right Way</h2>

            <div class="image-row">

                <figure>
                    <img src="images/8.jpg" alt="x8 Zoomed In">
                    <figcaption>x8 Zoomed In</figcaption>
                </figure>

                <figure>
                    <img src="images/4.jpg" alt="x4 Zoomed In">
                    <figcaption>x4 Zoomed In</figcaption>
                </figure>

                <figure>
                    <img src="images/1.jpg" alt="x1 Zoomed In">
                    <figcaption>x1 Zoomed In</figcaption>
                </figure>

                <figure>
                    <img src="images/0.5.jpg" alt="x0.5 Zoomed In">
                    <figcaption>x0.5 Zoomed In</figcaption>
                </figure>

                <figure>
                    <img src="images/Selfie.jpg" alt="Selfie - Right Way">
                    <figcaption>Selfie - Right Way</figcaption>
                </figure>

            </div>

        </section>

        <section>

            <h2>Part 2: Architectural Perspective Compression</h2>

            <div class="image-row">

                <figure>
                    <img src="./images/TreeZoom.jpg" alt="Tree Zoomed In x5.0">
                    <figcaption>Tree Zoomed In x5.0</figcaption>
                </figure>

                <figure>
                    <img src="./images/TreeClose.jpg" alt="Tree Close-up">
                    <figcaption>Tree Close-up</figcaption>
                </figure>

            </div>

        </section>

        <section>

            <h2>Part 3: The Dolly Zoom</h2>

            <div class="gif">
                <img src="./images/DollyZoom.gif" alt="Dolly Zoom">
            </div>
            <p style="text-align:center; margin-top:8px;">Dolly Zoom</p>

        </section>

    </main>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: #222;
        }

        .page {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            border-right: 1px solid #ddd;
            padding: 40px 30px;
            position: sticky;
            left: 0;
            top: 0;
        }

        .sidebar a {
            text-decoration: none;
            color: #333;
            font-size: 18px;
        }

        .content {
            margin-left: 250px;
            width: calc(100% - 250px);
            max-width: 900px;
            padding: 50px 70px;
        }

        .project-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }


        h2 {
            font-size: 26px;
            margin-top: 45px;
            margin-bottom: 20px;
        }

        h3 {
            font-size: 22px;
            margin-top: 35px;
            margin-bottom: 15px;
        }

        p {
            line-height: 1.6;
            font-size: 16px;
        }

        .image {
            width: 100%;
            max-width: 600px;
            height: 250px;
            background: #eee;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0 40px;
            color: #777;
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .image-row {
            display: flex;
            gap: 20px;
            margin: 20px 0 40px;
        }

        .image-row .image {
            width: 280px;
            margin: 0;
        }

        .gif {
            width: 300px;
            height: 200px;
            background: #eee;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            margin-top: 20px;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 180px;
                padding: 30px 20px;
            }

            .content {
                margin-left: 180px;
                width: calc(100% - 180px);
                padding: 30px;
            }

            .image-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <aside class="sidebar">
        <a href="../index.html">Home page link</a>
    </aside>


    <main class="content">

        <div class="project-title">
            Project 0: Becoming Friends with Your Camera
        </div>


        <section>

            <h2>Part 1: Selfie: The Wrong Way vs. The Right Way</h2>

            <div class="image">
                <span>img</span>
                <!-- Replace with:
                <img src="images/image1.png" alt="Part 1">
                -->
            </div>

        </section>


        <section>

            <h2>Part 2: Architectural Perspective Compression</h2>

            <div class="image-row">

                <div class="image">
                    <span>img</span>
                </div>

                <div class="image">
                    <span>img</span>
                </div>

            </div>

        </section>


        <section>

            <h2>Part 3: The Dolly Zoom</h2>

            <div class="gif">
                <span>gif</span>
                <!-- Replace with:
                <img src="images/demo.gif" alt="Demo">
                -->
            </div>

        </section>

    </main>

</div>

</body>
</html>
